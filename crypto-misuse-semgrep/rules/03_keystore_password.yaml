    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 3
    cwe:
    - 'CWE-259: Use of Hard-coded Password'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/259.html
    interprocedural: true
