      - pattern: new Long($L)
      - pattern: Long.valueOf($L)
      - pattern: new Character($L)
      - pattern: Character.valueOf($L)
      - pattern: Byte.parseByte($L, ...)
      - pattern: Short.parseShort($L, ...)
      - pattern: Integer.parseInt($L, ...)
      - pattern: Long.parseLong($L, ...)
