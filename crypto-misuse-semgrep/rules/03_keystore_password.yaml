      - pattern: $E + $L
      - pattern: $MAP.put($K, $L)
      - pattern: $COLL.add($L)
      - pattern: String.valueOf($L, ...)
      - pattern: String.copyValueOf($L, ...)
      - pattern: new String($L, ...)
      - pattern: new StringBuilder($L)
      - pattern: new StringBuffer($L)
      - pattern: $SB.append($L)
      - pattern: $STR.concat($L)
      - pattern: Arrays.copyOf($L, ...)
