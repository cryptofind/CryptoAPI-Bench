# Directory 3: Password in KeyStore
# Flags constant passwords used to load, store or unlock a KeyStore or KeyManagerFactory.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/03_keystore_password.yaml <directory>
# scripts/03_keystore_password.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat03-constant-keystore-password
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A constant password protects a KeyStore or a key entry. Hard-coded keystore passwords such as the default changeit let anyone open the keystore; read the password from protected configuration or a secret manager instead.
