# Directory 4: Hostname Verifier
# Flags HostnameVerifier implementations or lambdas that accept every host.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/04_hostname_verifier.yaml <directory>
# scripts/04_hostname_verifier.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat04-hostnameverifier-accepts-all
  languages:
  - java
  severity: ERROR
  message: This HostnameVerifier accepts every host because verify() returns true without checking the name. That disables TLS server-identity checks and enables man-in-the-middle attacks; use HttpsURLConnection.getDefaultHostnameVerifier() or compare the host with the certificate.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 4
    cwe:
    - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/297.html
  patterns:
  - pattern: boolean verify(String $H, SSLSession $S) { ... return true; ... }
  - pattern-not: boolean verify(String $H, SSLSession $S) { ... return false; ... }
  - pattern-not: boolean verify(String $H, SSLSession $S) { ... return $V.verify(...); ... }
  - pattern-not: boolean verify(String $H, SSLSession $S) { ... throw $E; ... }
- id: cat04-lambda-hostnameverifier-accepts-all
  languages:
  - java
  severity: ERROR
  message: A lambda HostnameVerifier accepts every host. That disables TLS server-identity checks; use the default verifier instead.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 4
    cwe:
    - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/297.html
  patterns:
  - pattern-either:
    - pattern: ($H, $S) -> true
    - pattern: ($H, $S) -> { return true; }
  - pattern-either:
    - pattern-inside: $X.setHostnameVerifier(...)
    - pattern-inside: HttpsURLConnection.setDefaultHostnameVerifier(...)
    - pattern-inside: $X.hostnameVerifier(...)
    - pattern-inside: $X.setSSLHostnameVerifier(...)
    - pattern-inside: new SSLConnectionSocketFactory(...)
    - pattern-inside: HostnameVerifier $V = ...;
- id: cat04-allow-all-hostnameverifier
  languages:
  - java
  severity: ERROR
  message: A library allow-all HostnameVerifier is used. It accepts certificates issued for any host; use the default verifier instead.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 4
    cwe:
    - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/297.html
  pattern-either:
  - pattern: NoopHostnameVerifier.INSTANCE
  - pattern: new NoopHostnameVerifier()
  - pattern: new AllowAllHostnameVerifier()
  - pattern: SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
  - pattern: SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
