# Directory 5: Certificate Validation
# Flags X509TrustManager implementations and helpers that accept every certificate.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/05_certificate_validation.yaml <directory>
# scripts/05_certificate_validation.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat05-trustmanager-accepts-all
  languages:
  - java
  severity: ERROR
  message: 'X509TrustManager.$M() never rejects a certificate: it neither throws CertificateException nor delegates to a real TrustManager. Every certificate, including self-signed or attacker-issued ones, is trusted; delegate to the default TrustManagerFactory instead.'
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 5
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/295.html
  patterns:
  - pattern: void $M(X509Certificate[] $CHAIN, ...) { ... }
  - metavariable-regex:
      metavariable: $M
      regex: ^check(?:Server|Client)Trusted$
  - pattern-not: void $M(...) { ... throw $E; ... }
  - pattern-not: void $M(...) { ... $TM.$M(...); ... }
  - pattern-not: void $M(...) { ... $CERT.checkValidity(...); ... }
  - pattern-not: void $M(...) { ... $CERT.verify(...); ... }
- id: cat05-trustmanager-swallows-validation-error
  languages:
  - java
  severity: ERROR
  message: A certificate-validation exception is caught and ignored inside $M(). Validation failures are silently turned into success; let the CertificateException propagate.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 5
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/295.html
  patterns:
  - pattern-inside: void $M(X509Certificate[] $CHAIN, ...) { ... }
  - metavariable-regex:
      metavariable: $M
      regex: ^check(?:Server|Client)Trusted$
  - pattern: try { ... } catch ($EX $E) { ... }
  - pattern-not: try { ... } catch ($EX $E) { ... throw $T; ... }
- id: cat05-accepted-issuers-null
  languages:
  - java
  severity: WARNING
  message: getAcceptedIssuers() returns null, a hallmark of a trust-all TrustManager. Delegate to a real X509TrustManager or return an empty array.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 5
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/295.html
  pattern: X509Certificate[] getAcceptedIssuers() { return null; }
- id: cat05-trust-all-helper
  languages:
  - java
  severity: ERROR
  message: A library trust-all strategy or TrustManagerFactory disables certificate validation. Rely on the platform trust store or on explicit certificate pinning instead.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 5
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/295.html
  pattern-either:
  - pattern: TrustAllStrategy.INSTANCE
  - pattern: new TrustAllStrategy()
  - pattern: new TrustSelfSignedStrategy()
  - pattern: InsecureTrustManagerFactory.INSTANCE
- id: cat05-trust-all-lambda
  languages:
  - java
  severity: ERROR
  message: A TrustStrategy lambda accepts every certificate chain. Remove it and rely on normal validation.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 5
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/295.html
  pattern: $B.loadTrustMaterial($KS, ($C, $A) -> true)
