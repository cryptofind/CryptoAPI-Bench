# Directory 6: SSL Socket
# Flags SSLSocket creation without hostname verification.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/06_ssl_socket.yaml <directory>
# scripts/06_ssl_socket.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat06-sslsocket-without-hostname-verification
  languages:
  - java
  severity: ERROR
  message: An SSLSocket is created without verifying the server host name. SSLSocket does not check that the certificate matches the host, so any valid certificate is accepted; call HostnameVerifier.verify() on the session or set SSLParameters.setEndpointIdentificationAlgorithm("HTTPS").
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 6
    cwe:
    - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/297.html
  patterns:
  - pattern-either:
    - pattern: (SSLSocketFactory $F).createSocket(...)
    - pattern: ((SSLSocketFactory) $X).createSocket(...)
    - pattern: SSLSocketFactory.getDefault().createSocket(...)
    - pattern: (SSLContext $CTX).getSocketFactory().createSocket(...)
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        $HV.verify(...);
        ...
      }
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        if (<... $HV.verify(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        if (<... $HV.verify(...) ...>) throw $EXC;
        ...
      }
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        $VT $VB = <... $HV.verify(...) ...>;
        ...
      }
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        return <... $HV.verify(...) ...>;
        ...
      }
  - pattern-not-inside: |-
      $RT $M(...) {
        ...
        $SSLP.setEndpointIdentificationAlgorithm(...);
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        $HV.verify(...);
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        if (<... $HV.verify(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        if (<... $HV.verify(...) ...>) throw $EXC;
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        $VT $VB = <... $HV.verify(...) ...>;
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        return <... $HV.verify(...) ...>;
        ...
      }
  - pattern-not-inside: |-
      $M(...) {
        ...
        $SSLP.setEndpointIdentificationAlgorithm(...);
        ...
      }
