# Directory 7: HTTP Protocol
# Flags plain http:// URLs used for network requests.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/07_http_protocol.yaml <directory>
# scripts/07_http_protocol.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat07-cleartext-http-url
  mode: taint
  languages:
  - java
  severity: WARNING
  message: A plain http:// URL is used for a network request. Traffic, including any credentials or tokens, can be read and modified in transit; use https://.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 7
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/319.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^http://(?!(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])(?:[:/]|$))(?!www\.w3\.org/).*$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: new URL($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: URI.create($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new URI($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpGet($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpPost($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpPut($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpDelete($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpPatch($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpHead($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new HttpOptions($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REQUEST.url($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: Jsoup.connect($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REST.getForObject($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REST.getForEntity($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REST.postForObject($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REST.postForEntity($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: $REST.exchange($L, ...)
    - focus-metavariable: $L
- id: cat07-http-scheme-literal
  languages:
  - java
  severity: WARNING
  message: A URL is built with the plain http scheme. Use https instead.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 7
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/319.html
  patterns:
  - pattern: new URL("$PROTO", $HOST, ...)
  - metavariable-regex:
      metavariable: $PROTO
      regex: (?i)^http$
