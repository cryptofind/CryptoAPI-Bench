# Directory 8: PRNG
# Flags non-cryptographic PRNGs (java.util.Random, Math.random, ThreadLocalRandom).
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/08_prng.yaml <directory>
# scripts/08_prng.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat08-insecure-prng
  languages:
  - java
  severity: WARNING
  message: A non-cryptographic pseudo-random generator is used. java.util.Random, Math.random() and ThreadLocalRandom are predictable; use java.security.SecureRandom for keys, IVs, salts, tokens and passwords.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 8
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/338.html
  pattern-either:
  - pattern: new java.util.Random(...)
  - pattern: new Random(...)
  - pattern: Math.random()
  - pattern: ThreadLocalRandom.current()
  - pattern: new SplittableRandom(...)
  - patterns:
    - pattern-either:
      - pattern: RandomStringUtils.$FN(...)
      - pattern: RandomUtils.$FN(...)
    - metavariable-regex:
        metavariable: $FN
        regex: ^(?:random|next)
- id: cat08-insecure-prng-in-crypto
  mode: taint
  languages:
  - java
  severity: ERROR
  message: Output of a non-cryptographic PRNG is used as key material, salt, IV, seed or password. An attacker who observes a few outputs can predict the rest; use SecureRandom.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 8
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/338.html
  pattern-sources:
  - pattern-either:
    - pattern: new java.util.Random(...)
    - pattern: new Random(...)
    - pattern: Math.random()
    - pattern: ThreadLocalRandom.current()
    - pattern: new SplittableRandom(...)
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  - pattern: $RND.nextBytes($OUT)
    from: $RND
    to: $OUT
  pattern-sinks:
  - patterns:
    - pattern: new SecretKeySpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new DESKeySpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new DESedeKeySpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new PKCS8EncodedKeySpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new RSAPrivateKeySpec($MODULUS, $L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new PBEParameterSpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new PBEKeySpec($PASSWORD, $L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new IvParameterSpec($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new GCMParameterSpec($TAGLEN, $L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new ChaCha20ParameterSpec($L, $COUNTER)
    - focus-metavariable: $L
  - patterns:
    - pattern: new SecureRandom($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: $RND.setSeed($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new PBEKeySpec($L, ...)
    - focus-metavariable: $L
