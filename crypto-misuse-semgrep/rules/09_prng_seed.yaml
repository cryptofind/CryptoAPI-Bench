# Directory 9: Seed in PRNG
# Flags constant or time-based seeds given to SecureRandom.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/09_prng_seed.yaml <directory>
# scripts/09_prng_seed.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat09-predictable-prng-seed
  mode: taint
  languages:
  - java
  severity: ERROR
  message: SecureRandom is seeded with a constant or time-based value. Seeding before first use can make SHA1PRNG fully deterministic, so keys, nonces and tokens become predictable; let SecureRandom seed itself.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 9
    cwe:
    - 'CWE-337: Predictable Seed in Pseudo-Random Number Generator (PRNG)'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/337.html
    interprocedural: true
    argument-literal:
    - - metavariable-regex:
          metavariable: $ARG
          regex: ^\(?\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")|\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|new\s+\w+\s*(?:\[\s*\]\s*)+\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|(?:new\s+[\w.]+|[\w.]+\.valueOf)\s*\(\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*\))\s*\)?$
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $X = $L
      - pattern: $T $X = $L;
      - pattern: return $L;
      - pattern: $L.$M(...)
      - pattern: $L + $E
      - pattern: $E + $L
      - pattern: $MAP.put($K, $L)
      - pattern: $COLL.add($L)
      - pattern: String.valueOf($L, ...)
      - pattern: String.copyValueOf($L, ...)
      - pattern: new String($L, ...)
      - pattern: new StringBuilder($L)
      - pattern: new StringBuffer($L)
      - pattern: $SB.append($L)
      - pattern: $STR.concat($L)
      - pattern: Arrays.copyOf($L, ...)
      - pattern: Arrays.copyOfRange($L, ...)
      - pattern: Arrays.asList(..., $L, ...)
      - pattern: $DEC.decode($L)
      - pattern: DatatypeConverter.parseBase64Binary($L)
      - pattern: DatatypeConverter.parseHexBinary($L)
      - pattern: Hex.decodeHex($L)
      - pattern: Base64.decodeBase64($L)
      - pattern: new BigInteger($L, ...)
      - pattern: BigInteger.valueOf($L)
      - pattern: new Byte($L)
      - pattern: Byte.valueOf($L)
      - pattern: new Short($L)
      - pattern: Short.valueOf($L)
      - pattern: new Integer($L)
      - pattern: Integer.valueOf($L)
      - pattern: new Long($L)
      - pattern: Long.valueOf($L)
      - pattern: new Character($L)
      - pattern: Character.valueOf($L)
      - pattern: Byte.parseByte($L, ...)
      - pattern: Short.parseShort($L, ...)
      - pattern: Integer.parseInt($L, ...)
      - pattern: Long.parseLong($L, ...)
    - metavariable-regex:
        metavariable: $L
        regex: ^\(?\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")|\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|new\s+\w+\s*(?:\[\s*\]\s*)+\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|(?:new\s+[\w.]+|[\w.]+\.valueOf)\s*\(\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*\))\s*\)?$
    - focus-metavariable: $L
  - patterns:
    - pattern: new SecureRandom($L)
    - metavariable-regex:
        metavariable: $L
        regex: ^\(?\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")|\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|new\s+\w+\s*(?:\[\s*\]\s*)+\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|(?:new\s+[\w.]+|[\w.]+\.valueOf)\s*\(\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*\))\s*\)?$
    - focus-metavariable: $L
  - patterns:
    - pattern: $RND.setSeed($L)
    - metavariable-regex:
        metavariable: $L
        regex: ^\(?\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")|\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|new\s+\w+\s*(?:\[\s*\]\s*)+\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|(?:new\s+[\w.]+|[\w.]+\.valueOf)\s*\(\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*\))\s*\)?$
    - focus-metavariable: $L
  - pattern-either:
    - pattern: System.currentTimeMillis()
    - pattern: System.nanoTime()
    - pattern: new Date().getTime()
    - pattern: new java.util.Date().getTime()
    - pattern: Instant.now().toEpochMilli()
    - pattern: Calendar.getInstance().getTimeInMillis()
  - pattern: new $T[$N]
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sanitizers:
