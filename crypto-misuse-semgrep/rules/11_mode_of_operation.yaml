# Directory 11: Mode of Operation
# Flags ECB mode, explicit or implied by a transformation without a mode.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/11_mode_of_operation.yaml <directory>
# scripts/11_mode_of_operation.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat11-ecb-mode
  mode: taint
  languages:
  - java
  severity: ERROR
  message: The cipher runs in ECB mode, either explicitly or because the transformation names no mode (the JCE default for block ciphers is ECB). ECB encrypts equal blocks to equal ciphertext and leaks plaintext structure; use an authenticated mode such as AES/GCM/NoPadding.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 11
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/327.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^(?:AES(?:_\d+)?|DES|DESede|TripleDES|3DES|Blowfish|RC2|RC5|IDEA|Camellia|SEED|ARIA|CAST5|CAST6|Twofish|Serpent|SM4|GOST28147|Skipjack|XTEA|Rijndael)(?:/ECB(?:/[\w-]*)?)?$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: Cipher.getInstance($L, ...)
    - focus-metavariable: $L
