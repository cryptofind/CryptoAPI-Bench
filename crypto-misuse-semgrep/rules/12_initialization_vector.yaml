# Directory 12: Initialization Vector
# Flags constant or all-zero initialization vectors.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/12_initialization_vector.yaml <directory>
# scripts/12_initialization_vector.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat12-static-iv
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A constant or never-filled (all-zero) initialization vector is used. A predictable or reused IV leaks information and is catastrophic for GCM and CTR; generate a fresh random IV for every encryption.
