    - focus-metavariable: $L
  - patterns:
    - pattern: new ChaCha20ParameterSpec($L, $COUNTER)
    - metavariable-regex:
        metavariable: $L
        regex: ^\(?\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")|\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|new\s+\w+\s*(?:\[\s*\]\s*)+\{\s*(?:(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*(?:,\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*)*,?\s*)?\}|(?:new\s+[\w.]+|[\w.]+\.valueOf)\s*\(\s*(?:(?:\(\s*\w+\s*\)\s*)?(?:-?(?:0[xX][0-9a-fA-F]+|0[bB][01]+|\d+)[lL]?|'(?:[^'\\]|\\.)+')|"(?:[^"\\]|\\.)+")\s*\))\s*\)?$
