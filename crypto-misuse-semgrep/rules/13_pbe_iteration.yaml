# Directory 13: Iteration in PBE
# Flags PBE iteration counts below 1000.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/13_pbe_iteration.yaml <directory>
# scripts/13_pbe_iteration.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat13-low-pbe-iteration-count
  mode: taint
  languages:
  - java
  severity: ERROR
  message: The PBE iteration count is below 1000. Few iterations make offline password guessing cheap; use at least 1000 (CryptoGuard's threshold) and preferably the current OWASP recommendation, which is in the hundreds of thousands for PBKDF2.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 13
    cwe:
    - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/916.html
    interprocedural: true
    argument-literal:
    - - metavariable-regex:
          metavariable: $ARG
          regex: ^-?\d+$
      - metavariable-comparison:
          metavariable: $ARG
          comparison: $ARG < 1000
    - - metavariable-regex:
          metavariable: $ARG
          regex: ^"\s*-?\d+\s*"$
      - metavariable-comparison:
          metavariable: $ARG
          comparison: int($ARG) < 1000
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $X = $L
      - pattern: $T $X = $L;
      - pattern: return $L;
      - pattern: $L.$M(...)
      - pattern: $L + $E
      - pattern: $E + $L
      - pattern: $MAP.put($K, $L)
      - pattern: $COLL.add($L)
      - pattern: String.valueOf($L, ...)
      - pattern: String.copyValueOf($L, ...)
      - pattern: new String($L, ...)
      - pattern: new StringBuilder($L)
      - pattern: new StringBuffer($L)
      - pattern: $SB.append($L)
      - pattern: $STR.concat($L)
      - pattern: Arrays.copyOf($L, ...)
      - pattern: Arrays.copyOfRange($L, ...)
      - pattern: Arrays.asList(..., $L, ...)
      - pattern: $DEC.decode($L)
      - pattern: DatatypeConverter.parseBase64Binary($L)
      - pattern: DatatypeConverter.parseHexBinary($L)
      - pattern: Hex.decodeHex($L)
      - pattern: Base64.decodeBase64($L)
      - pattern: new BigInteger($L, ...)
      - pattern: BigInteger.valueOf($L)
      - pattern: new Byte($L)
      - pattern: Byte.valueOf($L)
      - pattern: new Short($L)
      - pattern: Short.valueOf($L)
      - pattern: new Integer($L)
      - pattern: Integer.valueOf($L)
      - pattern: new Long($L)
      - pattern: Long.valueOf($L)
      - pattern: new Character($L)
      - pattern: Character.valueOf($L)
      - pattern: Byte.parseByte($L, ...)
      - pattern: Short.parseShort($L, ...)
      - pattern: Integer.parseInt($L, ...)
      - pattern: Long.parseLong($L, ...)
    - metavariable-regex:
        metavariable: $L
        regex: ^-?\d+$
    - metavariable-comparison:
        metavariable: $L
        comparison: $L < 1000
    - focus-metavariable: $L
  - patterns:
    - pattern-either:
      - pattern: $X = $L
      - pattern: $T $X = $L;
      - pattern: return $L;
      - pattern: $L.$M(...)
      - pattern: $L + $E
      - pattern: $E + $L
      - pattern: $MAP.put($K, $L)
      - pattern: $COLL.add($L)
      - pattern: String.valueOf($L, ...)
      - pattern: String.copyValueOf($L, ...)
      - pattern: new String($L, ...)
      - pattern: new StringBuilder($L)
      - pattern: new StringBuffer($L)
      - pattern: $SB.append($L)
      - pattern: $STR.concat($L)
      - pattern: Arrays.copyOf($L, ...)
      - pattern: Arrays.copyOfRange($L, ...)
      - pattern: Arrays.asList(..., $L, ...)
      - pattern: $DEC.decode($L)
      - pattern: DatatypeConverter.parseBase64Binary($L)
      - pattern: DatatypeConverter.parseHexBinary($L)
      - pattern: Hex.decodeHex($L)
      - pattern: Base64.decodeBase64($L)
      - pattern: new BigInteger($L, ...)
      - pattern: BigInteger.valueOf($L)
      - pattern: new Byte($L)
      - pattern: Byte.valueOf($L)
      - pattern: new Short($L)
      - pattern: Short.valueOf($L)
      - pattern: new Integer($L)
      - pattern: Integer.valueOf($L)
      - pattern: new Long($L)
      - pattern: Long.valueOf($L)
      - pattern: new Character($L)
