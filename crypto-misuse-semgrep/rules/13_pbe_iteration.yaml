    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sanitizers:
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $RND.nextBytes($FILLED)
      - pattern: $IN.read($FILLED, ...)
      - pattern: $IN.readFully($FILLED, ...)
      - pattern: (ByteBuffer $BUF).get($FILLED, ...)
      - pattern: System.arraycopy($SRC, $SRCPOS, $FILLED, ...)
    - focus-metavariable: $FILLED
  pattern-sinks:
  - patterns:
    - pattern: new PBEParameterSpec($SALT, $L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new PBEKeySpec($PASSWORD, $SALT, $L, ...)
    - focus-metavariable: $L
