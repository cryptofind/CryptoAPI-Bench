# Directory 14: Symmetric Ciphers
# Flags broken symmetric ciphers (DES, 3DES, RC2, RC4, Blowfish, IDEA, ...).
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/14_symmetric_ciphers.yaml <directory>
# scripts/14_symmetric_ciphers.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat14-broken-symmetric-cipher
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A broken or weak symmetric cipher is used (DES, 3DES, RC2, RC4, Blowfish, IDEA or similar). These have short keys, 64-bit blocks or biased keystreams; use AES (AES/GCM/NoPadding) or ChaCha20-Poly1305.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 14
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/327.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^(?:(?:DES|DESede|TripleDES|3DES|DES3|RC2|RC4|ARCFOUR|ARC4|Blowfish|IDEA|RC5|CAST5|Skipjack|GOST28147|XTEA|TEA)(?:/[\w-]+/[\w-]+)?|PBEWith\w*?And(?:DES|DESede|TripleDES|RC2_\d+|RC4_\d+))$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: Cipher.getInstance($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: KeyGenerator.getInstance($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: SecretKeyFactory.getInstance($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: new SecretKeySpec($KEY, $L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new SecretKeySpec($KEY, $OFFSET, $LEN, $L)
    - focus-metavariable: $L
- id: cat14-des-keyspec
  languages:
  - java
  severity: WARNING
  message: DESKeySpec/DESedeKeySpec builds keys for a broken cipher. Migrate to AES keys.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 14
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/327.html
  pattern-either:
  - pattern: new DESKeySpec(...)
  - pattern: new DESedeKeySpec(...)
