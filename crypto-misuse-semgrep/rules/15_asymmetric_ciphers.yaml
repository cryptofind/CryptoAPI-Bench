- id: cat15-weak-ec-curve
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A weak elliptic curve (smaller than 224 bits) is selected. Use secp256r1, secp384r1 or X25519.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 15
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/326.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^(?:secp(?:112|128|160|192)\w*|sect(?:113|131|163|193)\w*|prime192v\d|c2[pt]nb1(?:63|76|91)\w*|brainpoolP(?:160|192)[rt]1|P-192|nistp192)$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: new ECGenParameterSpec($L)
    - focus-metavariable: $L
- id: cat15-rsa-without-padding
  mode: taint
  languages:
  - java
  severity: WARNING
  message: RSA is used without padding (textbook RSA). Unpadded RSA is deterministic and malleable; use RSA/ECB/OAEPWithSHA-256AndMGF1Padding.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 15
    cwe:
    - 'CWE-780: Use of RSA Algorithm without OAEP'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/780.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^RSA/(?:ECB|NONE)/NoPadding$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
