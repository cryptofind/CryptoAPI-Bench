# Directory 15: Asymmetric Ciphers
# Flags RSA/DSA/DH keys below 2048 bits, weak elliptic curves and unpadded RSA.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/15_asymmetric_ciphers.yaml <directory>
# scripts/15_asymmetric_ciphers.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

