# Directory 16: Cryptographic Hash
# Flags broken hashes (MD2, MD4, MD5, SHA-1) and MD5/SHA-1 based signatures.
#
# Plain Semgrep rules; run them on their own with:
#     semgrep scan --config rules/16_cryptographic_hash.yaml <directory>
# scripts/16_cryptographic_hash.py runs the same rules and adds the summary-based
# inter-procedural layer for taint rules marked `interprocedural: true`.
# Generated by tools/build_rules.py.

rules:
- id: cat16-broken-hash
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A broken hash function (MD2, MD4, MD5 or SHA-1) is used. Practical collision attacks exist for all of them; use SHA-256 or stronger, and PBKDF2, bcrypt or Argon2 for passwords.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 16
    cwe:
    - 'CWE-328: Use of Weak Hash'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/328.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^(?:MD2|MD4|MD5|SHA|SHA-?0|SHA-?1)$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: MessageDigest.getInstance($L, ...)
    - focus-metavariable: $L
  - patterns:
    - pattern: DigestUtils.getDigest($L)
    - focus-metavariable: $L
  - patterns:
    - pattern: new DigestUtils($L)
    - focus-metavariable: $L
- id: cat16-weak-signature-hash
  mode: taint
  languages:
  - java
  severity: ERROR
  message: A signature algorithm based on MD2, MD5 or SHA-1 is used. Use SHA256withRSA, SHA256withECDSA or stronger.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 16
    cwe:
    - 'CWE-328: Use of Weak Hash'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/328.html
    interprocedural: true
  pattern-sources:
  - patterns:
    - pattern: '"$S"'
    - metavariable-regex:
        metavariable: $S
        regex: (?i)^(?:MD2|MD5|SHA1?|SHA-1)with\w+$
  pattern-propagators:
  - pattern: $MAP.put($K, $V)
    from: $V
    to: $MAP
  - pattern: $COLL.add($V)
    from: $V
    to: $COLL
  - pattern: $SB.append($V)
    from: $V
    to: $SB
  pattern-sinks:
  - patterns:
    - pattern: Signature.getInstance($L, ...)
    - focus-metavariable: $L
- id: cat16-broken-hash-helper
  languages:
  - java
  severity: ERROR
  message: A library helper computes an MD2, MD5 or SHA-1 digest. Use SHA-256 or stronger.
  metadata:
    category: security
    subcategory:
    - vuln
    cryptoapi-bench-category: 16
    cwe:
    - 'CWE-328: Use of Weak Hash'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://cwe.mitre.org/data/definitions/328.html
  pattern-either:
  - patterns:
    - pattern: DigestUtils.$FN(...)
    - metavariable-regex:
        metavariable: $FN
        regex: ^(?:md2|md5|sha1?|md2Hex|md5Hex|sha1Hex|shaHex|getMd2Digest|getMd5Digest|getShaDigest|getSha1Digest)$
  - pattern: Hashing.md5()
  - pattern: Hashing.sha1()
